<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Share Flex Message Ready</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #eef2ff;
        }
        .msg {
            display: none;
            padding: 20px 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            font-size: 18px;
            text-align: center;
            color: #333;
        }
        #errorMsg { 
            color: #d9534f;
            word-break: break-word;
            max-width: 80vw;
        }
    </style>
</head>
<body>
    <div class="msg" id="loadingMsg">⏳ กำลังเริ่มต้น LIFF และเตรียมการแชร์...</div>
    <div class="msg" id="successMsg">✅ แชร์ให้เพื่อน ๆ สำเร็จแล้ว</div>
    <div class="msg" id="errorMsg">❌ เกิดข้อผิดพลาดในการแชร์</div> 

    <script>
        // แก้ไขโครงสร้าง Flex Message ให้ถูกต้อง
        const flexMessage = {
            type: "flex",
            altText: "📚 แนะนำหนังสือน่าอ่าน โดย นตท.ชั้นปีที่ 2",
            contents: {
  "type": "carousel",
  "contents": [
    {

        "contents": [
          {

            "url": "https://img5.pic.in.th/file/secure-sv1/9a4da49d15ca88337d84aa2ff37b6f83.png",
            "size": "full",
            "animated": true,
            "aspectMode": "cover",
            "aspectRatio": "2.3:3",
            "offsetBottom": "none"
          },
          {
            "type": "button",
            "action": {
              "type": "uri",
              "uri": "https://liff.line.me/2008893224-OPdL7Glb",
              "label": "    "
            },
            "position": "absolute",
            "offsetTop": "73%",
            "offsetEnd": "29%",
            "gravity": "bottom",
            "offsetStart": "30%",
            "offsetBottom": "14%"
          }
        ],
        "borderWidth": "none",
        "paddingAll": "none"
      }
    },
    {
      "type": "bubble",
      "hero": {
        "type": "image",
        "url": "https://img2.pic.in.th/327b8055c0d3d334f.png",
        "size": "full",
        "aspectMode": "cover",
        "aspectRatio": "2.9:3",
        "animated": true,
        "action": {
          "type": "uri",
          "label": "action",
          "uri": "https://www.youtube.com/shorts/OqjQaADF-fA"
        }
      },
      "body": {
        "type": "box",
        "layout": "vertical",
        "backgroundColor": "#9370DB",
        "contents": [
          {
            "type": "text",
            "text": "ชื่อหนังสือ:สันติบาล",
            "weight": "bold",
            "size": "md",
            "color": "#4A148C",
            "wrap": true
          },
          {
            "type": "text",
            "text": "แนะนำโดย : นตท.พุฒิพงศ์ พลสวัสดิ์",
            "size": "sm",
            "color": "#6A1B9A",
            "wrap": true
          }
        ],
        "cornerRadius": "none"
      }
    },
    {
      "type": "bubble",
      "hero": {
        "type": "image",
        "url": "https://img2.pic.in.th/14ab8f78378507f20.png",
        "size": "full",
        "aspectMode": "cover",
        "aspectRatio": "2.9:3",
        "animated": true,
        "action": {
          "type": "uri",
          "label": "action",
          "uri": "https://www.youtube.com/watch?app=desktop&v=8VpNAhY9-BI"
        }
      },
      "body": {
        "type": "box",
        "layout": "vertical",
        "backgroundColor": "#9370DB",
        "contents": [
          {
            "type": "text",
            "text": "ชื่อหนังสือ:อาการไม่มั่นใจในตัวเอง มีพฤติกรรมอย่างไร?",
            "weight": "bold",
            "size": "md",
            "color": "#4A148C",
            "wrap": true
          },
          {
            "type": "text",
            "text": "แนะนำโดย : นตท.ภูมิภัทร นามแก้ว",
            "size": "sm",
            "color": "#6A1B9A",
            "wrap": true
          }
        ],
        "cornerRadius": "none"
      }
    },
    {
      "type": "bubble",
      "hero": {
        "type": "image",
        "url": "https://img5.pic.in.th/file/secure-sv1/2cad8b3cc92316f65.png",
        "size": "full",
        "aspectMode": "cover",
        "aspectRatio": "2.9:3",
        "animated": true,
        "action": {
          "type": "uri",
          "label": "action",
          "uri": "https://www.youtube.com/shorts/xYmHmLE7188?app=desktop&si=N82T9qJlWGMekpz2&fbclid=PAVERFWAPSwodleHRuA2FlbQIxMABzcnRjBmFwcF9pZA8xMjQwMjQ1NzQyODc0MTQAAacQiIusc3wvvWlZQBtS8vWfcAKiLHQBshvR1mbm8hEqq7o6uLSpmuIm7QbXOg_aem_dVoFgWJ48LGc9zVH-cvaBg"
        }
      },
      "body": {
        "type": "box",
        "layout": "vertical",
        "backgroundColor": "#9370DB",
        "contents": [
          {
            "type": "text",
            "text": "ชื่อหนังสือ:เคมีทั่วไป",
            "weight": "bold",
            "size": "md",
            "color": "#4A148C",
            "wrap": true
          },
          {
            "type": "text",
            "text": "แนะนำโดย : นตท.พิสิษฐ์ โรจนแพทย์",
            "size": "sm",
            "color": "#6A1B9A",
            "wrap": true
          }
        ],
        "cornerRadius": "none"
      }
    }
  ]
}
        };

        function displayMessage(id) {
            document.querySelectorAll('.msg').forEach(el => el.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        async function main() {
            displayMessage('loadingMsg');
            
            try {
                // เริ่มต้น LIFF
                await liff.init({ liffId: "2008893224-OPdL7Glb" });  

                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                
                if (!liff.isApiAvailable("shareTargetPicker")) {
                    throw new Error("เครื่องมือนี้ต้องเปิดผ่านแอป LINE เท่านั้น");
                }

                document.getElementById("loadingMsg").style.display = "none";

                // เรียกใช้ Share Target Picker
                const result = await liff.shareTargetPicker([flexMessage]);
                
                if (result) {
                    displayMessage('successMsg');
                    setTimeout(() => liff.closeWindow(), 2000);
                } else {
                    liff.closeWindow();
                }

            } catch (err) {
                console.error("Share Error:", err);
                const errorMsgElement = document.getElementById('errorMsg');
                errorMsgElement.innerHTML = `❌ เกิดข้อผิดพลาด: <br> ${err.message || 'ไม่ทราบสาเหตุ'}`;
                displayMessage('errorMsg'); 
                setTimeout(() => liff.closeWindow(), 5000); 
            }
        }

        main();
    </script>
</body>
</html>
